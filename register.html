<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — Chemsbury Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f1a;
    --bg2: #0e1525;
    --bg3: #131c2e;
    --surface: #1a2540;
    --surface2: #1f2d4a;
    --border: rgba(99,179,237,0.12);
    --border2: rgba(99,179,237,0.22);
    --accent: #3ecfcf;
    --accent2: #5b9cf6;
    --danger: #f87171;
    --success: #34d399;
    --text: #e8f0fe;
    --text2: #8ba3cc;
    --text3: #4a6080;
    --glow: 0 0 40px rgba(62,207,207,0.15);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  body::before {
    content:'';
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse 70% 60% at 15% 10%, rgba(62,207,207,0.07) 0%, transparent 60%),
      radial-gradient(ellipse 50% 50% at 85% 90%, rgba(91,156,246,0.07) 0%, transparent 60%);
    pointer-events:none; z-index:0;
  }
  body::after {
    content:'';
    position:fixed; inset:0;
    background-image:
      linear-gradient(rgba(99,179,237,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99,179,237,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events:none; z-index:0;
    animation: gridShift 20s linear infinite;
  }
  @keyframes gridShift {
    0% { background-position: 0 0; }
    100% { background-position: 60px 60px; }
  }

  .form-panel {
    position: relative; z-index: 1;
    width: 100%; max-width: 500px;
    padding: 40px 32px;
    margin: 40px auto;
  }

  .form-header { margin-bottom: 32px; }
  .logo {
    display: flex; align-items: center; gap: 10px;
    font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.1rem;
    margin-bottom: 32px; text-decoration: none; color: var(--text);
  }
  .logo-icon {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 8px;
    display: grid; place-items: center;
    font-size: 16px;
  }
  .logo span { color: var(--accent); }

  .form-header h2 {
    font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.8rem;
    letter-spacing: -0.02em; margin-bottom: 8px;
  }
  .form-header p { font-size: 0.9rem; color: var(--text2); }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media(max-width:520px) { .form-row { grid-template-columns: 1fr; } }

  .form-group { margin-bottom: 20px; }
  .form-group label {
    display: block;
    font-size: 0.78rem; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text3); margin-bottom: 8px;
  }
  .optional-tag {
    font-size: 0.68rem; color: var(--text3); font-weight: 400;
    text-transform: none; letter-spacing: 0; margin-left: 6px;
  }
  .input-wrap { position: relative; }
  .input-wrap .input-icon {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    font-size: 15px; opacity: 0.5; pointer-events: none;
  }
  .form-group input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px 12px 40px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .form-group input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(62,207,207,0.1);
  }
  .form-group input::placeholder { color: var(--text3); }
  .form-group input.invalid { border-color: var(--danger); }
  .form-group input.valid { border-color: rgba(52,211,153,0.5); }

  .field-hint {
    display: flex; align-items: center; gap: 6px;
    margin-top: 6px; font-size: 0.75rem; color: var(--text3);
  }
  .field-hint.error { color: var(--danger); }

  /* Password strength */
  .pw-strength { margin-top: 8px; }
  .pw-bar {
    height: 3px; border-radius: 3px;
    background: var(--surface2);
    overflow: hidden; margin-bottom: 5px;
  }
  .pw-bar-fill {
    height: 100%; border-radius: 3px;
    width: 0%; transition: width 0.3s, background 0.3s;
  }
  .pw-label { font-size: 0.72rem; color: var(--text3); }



  .submit-btn {
    width: 100%; padding: 13px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #0a0f1a; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.95rem;
    border: none; border-radius: 10px; cursor: pointer;
    transition: all 0.25s; letter-spacing: 0.02em;
    margin-top: 8px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .submit-btn:hover { transform: translateY(-1px); box-shadow: var(--glow); }
  .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .form-footer {
    margin-top: 24px; text-align: center;
    font-size: 0.875rem; color: var(--text2);
  }
  .form-footer a {
    color: var(--accent); text-decoration: none; font-weight: 500;
  }
  .form-footer a:hover { opacity: 0.8; }

  .error-msg {
    display: none;
    background: rgba(248,113,113,0.1);
    border: 1px solid rgba(248,113,113,0.3);
    border-radius: 10px; padding: 12px 16px;
    font-size: 0.85rem; color: var(--danger);
    margin-bottom: 20px;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity:0; transform: translateY(-6px); } to { opacity:1; transform: none; } }

  .spinner-small {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid rgba(10,15,26,0.3);
    border-top-color: #0a0f1a;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .divider {
    height: 1px; background: var(--border);
    margin: 28px 0;
  }


  .logo-img { height:40px; width:auto; object-fit:contain; border-radius:4px; }
  .logo-text-wrap { font-family:'Syne',sans-serif; font-weight:800; font-size:1.1rem; letter-spacing:-0.02em; color:var(--text); }
  .logo-text-wrap span { color:var(--accent); }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 10px; }
</style>
</head>

  <div class="form-header">
    <h2>Create account</h2>
    <p>Join Chemsbury — only @chemsbury.in addresses accepted</p>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <div class="form-row">
    <div class="form-group">
      <label>Full Name</label>
      <div class="input-wrap">
        <span class="input-icon">👤</span>
        <input type="text" id="name" placeholder="Anika Sharma" autocomplete="name">
      </div>
    </div>
    <div class="form-group">
      <label>Company <span class="optional-tag">optional</span></label>
      <div class="input-wrap">
        <span class="input-icon">🏢</span>
        <input type="text" id="company" placeholder="Chemsbury Ltd." autocomplete="organization">
      </div>
    </div>
  </div>

  <div class="form-group">
    <label>Email Address</label>
    <div class="input-wrap">
      <span class="input-icon">✉️</span>
      <input type="email" id="email" placeholder="you@chemsbury.in" autocomplete="email" oninput="validateEmail(this)">
    </div>
    <div class="field-hint" id="emailHint">🔒 Must be a @chemsbury.in address</div>
  </div>

  <div class="form-group">
  <label>Password</label>
  <div class="input-wrap">
    <span class="input-icon">🔑</span>
    <input type="password" id="password" placeholder="Minimum 8 characters" autocomplete="new-password" oninput="checkStrength(this.value)">
    <button type="button" onclick="toggleVisibility('password')" 
            style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--text3); font-size:16px; display:flex; align-items:center;">
      <span id="eye-icon-password">👁️</span>
    </button>
  </div>
  <div class="pw-strength">
    <div class="pw-bar"><div class="pw-bar-fill" id="pwBarFill"></div></div>
    <div class="pw-label" id="pwLabel">—</div>
  </div>
</div>

<div class="form-group">
  <label>Confirm Password</label>
  <div class="input-wrap">
    <span class="input-icon">🔑</span>
    <input type="password" id="confirm" placeholder="Repeat your password" autocomplete="new-password" oninput="validateConfirm(this)">
    <button type="button" onclick="toggleVisibility('confirm')" 
            style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--text3); font-size:16px; display:flex; align-items:center;">
      <span id="eye-icon-confirm">👁️</span>
    </button>
  </div>
  <div class="field-hint" id="confirmHint"></div>
</div>

  <button class="submit-btn" id="regBtn" onclick="doRegister()">
    <span id="regText">Create Account</span>
    <div class="spinner-small" id="regSpinner"></div>
  </button>

  <div class="form-footer">
    Already have an account? <a href="/">Sign in</a>
  </div>
</div>

<script>
  // Redirect if already logged in
  const token = localStorage.getItem('chem_token');
  if (token) {
    fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + token } })
      .then(r => { if (r.ok) window.location.href = '/app'; })
      .catch(() => {});
  }

  function validateEmail(input) {
    const hint = document.getElementById('emailHint');
    const val = input.value.trim().toLowerCase();
    if (!val) {
      input.classList.remove('valid', 'invalid');
      hint.textContent = '🔒 Must be a @chemsbury.in address';
      hint.className = 'field-hint';
      return;
    }
    if (val.endsWith('@chemsbury.in') && val.length > '@chemsbury.in'.length) {
      input.classList.add('valid'); input.classList.remove('invalid');
      hint.textContent = '✅ Valid domain';
      hint.className = 'field-hint';
      hint.style.color = 'var(--success)';
    } else {
      input.classList.add('invalid'); input.classList.remove('valid');
      hint.textContent = '❌ Must end with @chemsbury.in';
      hint.className = 'field-hint error';
      hint.style.color = '';
    }
  }

  // Function to toggle password visibility
function toggleVisibility(fieldId) {
    const input = document.getElementById(fieldId);
    const icon = document.getElementById('eye-icon-' + fieldId);
    
    if (input.type === "password") {
        input.type = "text";
        icon.textContent = "🙈"; // Change icon to 'hidden'
    } else {
        input.type = "password";
        icon.textContent = "👁️"; // Change icon back to 'visible'
    }
}

// Updated Register function with STRICT detailed validations
async function doRegister() {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    const company = document.getElementById('company').value.trim();

    // Reset Error Message
    const errEl = document.getElementById('errorMsg');
    errEl.style.display = 'none';

    // 1. Basic Field Checks
    if (!name) { showError('Full Name is required.'); return; }
    if (!email) { showError('Email address is required.'); return; }
    if (!email.endsWith('@chemsbury.in')) { showError('Please use your @chemsbury.in email.'); return; }

    // 2. STRICT PASSWORD VALIDATIONS
    if (password.length < 8) { 
        showError('Password is too short (Minimum 8 characters).'); return; 
    }
    if (!/[A-Z]/.test(password)) { 
        showError('Password must contain at least one uppercase letter (A-Z).'); return; 
    }
    if (!/[a-z]/.test(password)) { 
        showError('Password must contain at least one lowercase letter (a-z).'); return; 
    }
    if (!/[0-9]/.test(password)) { 
        showError('Password must contain at least one number (0-9).'); return; 
    }
    if (!/[^A-Za-z0-9]/.test(password)) { 
        showError('Password must contain at least one special symbol (@, #, $, etc.).'); return; 
    }

    // 3. Match Check
    if (password !== confirm) { 
        showError('Passwords do not match.'); return; 
    }

    // If all validations pass, proceed to API call
    const btn = document.getElementById('regBtn');
    const spinner = document.getElementById('regSpinner');
    const regText = document.getElementById('regText');

    btn.disabled = true;
    regText.textContent = 'Processing…';
    spinner.style.display = 'block';

    try {
        const resp = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, password, company })
        });
        const data = await resp.json();

        if (!resp.ok) {
            showError(data.error || 'Registration failed.');
            return;
        }

        localStorage.setItem('chem_token', data.token);
        localStorage.setItem('chem_user', JSON.stringify(data.user));
        window.location.href = '/app';
    } catch (e) {
        showError('Connection error. Please check your internet.');
    } finally {
        btn.disabled = false;
        regText.textContent = 'Create Account';
        spinner.style.display = 'none';
    }
}

  function checkStrength(pw) {
    const fill = document.getElementById('pwBarFill');
    const label = document.getElementById('pwLabel');
    let score = 0;
    if (pw.length >= 8) score++;
    if (pw.length >= 12) score++;
    if (/[A-Z]/.test(pw)) score++;
    if (/[0-9]/.test(pw)) score++;
    if (/[^A-Za-z0-9]/.test(pw)) score++;
    const levels = [
      { pct: '0%', color: 'transparent', label: '—' },
      { pct: '25%', color: 'var(--danger)', label: 'Weak' },
      { pct: '50%', color: 'var(--warning, #fbbf24)', label: 'Fair' },
      { pct: '75%', color: 'var(--accent2)', label: 'Good' },
      { pct: '90%', color: 'var(--success)', label: 'Strong' },
      { pct: '100%', color: 'var(--success)', label: 'Very Strong' },
    ];
    const lvl = levels[Math.min(score, levels.length-1)];
    fill.style.width = lvl.pct;
    fill.style.background = lvl.color;
    label.textContent = pw.length ? lvl.label : '—';
  }

  function validateConfirm(input) {
    const pw = document.getElementById('password').value;
    const hint = document.getElementById('confirmHint');
    if (!input.value) { hint.textContent = ''; return; }
    if (input.value === pw) {
      input.classList.add('valid'); input.classList.remove('invalid');
      hint.textContent = '✅ Passwords match';
      hint.style.color = 'var(--success)';
    } else {
      input.classList.add('invalid'); input.classList.remove('valid');
      hint.textContent = '❌ Passwords do not match';
      hint.style.color = 'var(--danger)';
    }
  }

  document.getElementById('confirm').addEventListener('keydown', e => {
    if (e.key === 'Enter') doRegister();
  });

  async function doRegister() {
    const name = document.getElementById('name').value.trim();
    const company = document.getElementById('company').value.trim();
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    const errEl = document.getElementById('errorMsg');

    errEl.style.display = 'none';

    if (!name) { showError('Please enter your full name.'); return; }
    if (!email) { showError('Please enter your email address.'); return; }
    if (!email.endsWith('@chemsbury.in')) { showError('Only @chemsbury.in email addresses are allowed.'); return; }
    if (password.length < 8) { showError('Password must be at least 8 characters.'); return; }
    if (password !== confirm) { showError('Passwords do not match.'); return; }

    const btn = document.getElementById('regBtn');
    const spinner = document.getElementById('regSpinner');
    const regText = document.getElementById('regText');

    btn.disabled = true;
    regText.textContent = 'Creating account…';
    spinner.style.display = 'block';

    try {
      const resp = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password, company })
      });
      const data = await resp.json();

      if (!resp.ok) {
        showError(data.error || 'Registration failed. Please try again.');
        return;
      }

      localStorage.setItem('chem_token', data.token);
      localStorage.setItem('chem_user', JSON.stringify(data.user));
      window.location.href = '/app';
    } catch (e) {
      showError('Connection error. Please try again.');
    } finally {
      btn.disabled = false;
      regText.textContent = 'Create Account';
      spinner.style.display = 'none';
    }
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.style.display = 'block';
  }
</script>
</body>
</html>
