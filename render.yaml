services:
  - type: web
    name: chemsbury
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /data/chemsbury.db
    disk:
      name: chemsbury-db
      mountPath: /data
      sizeGB: 1