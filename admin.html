<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — Chemsbury Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f1a; --bg2: #0e1525; --bg3: #131c2e;
    --surface: #1a2540; --surface2: #1f2d4a;
    --border: rgba(99,179,237,0.12); --border2: rgba(99,179,237,0.22);
    --accent: #3ecfcf; --accent2: #5b9cf6; --accent3: #a78bfa;
    --danger: #f87171; --warning: #fbbf24; --success: #34d399;
    --text: #e8f0fe; --text2: #8ba3cc; --text3: #4a6080;
    --glow: 0 0 40px rgba(62,207,207,0.15);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  body::before {
    content:''; position:fixed; inset:0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 0%, rgba(62,207,207,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 100%, rgba(91,156,246,0.06) 0%, transparent 60%);
    pointer-events:none; z-index:0;
  }

  header {
    position:sticky; top:0; z-index:100;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 40px; height:64px;
    background:rgba(10,15,26,0.9); backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);
  }
  .logo { display:flex; align-items:center; gap:10px; font-family:'Syne',sans-serif; font-weight:800; font-size:1.15rem; color:var(--text); text-decoration:none; }
  .logo-icon { width:32px; height:32px; background:linear-gradient(135deg,var(--accent),var(--accent2)); border-radius:8px; display:grid; place-items:center; font-size:16px; }
  .logo span { color:var(--accent); }
  .admin-badge {
    background:linear-gradient(90deg,rgba(167,139,250,0.2),rgba(91,156,246,0.2));
    border:1px solid rgba(167,139,250,0.3);
    color:var(--accent3); font-size:0.72rem; font-weight:600;
    padding:3px 10px; border-radius:100px; text-transform:uppercase; letter-spacing:0.05em;
  }
  .header-right { display:flex; align-items:center; gap:10px; }
  .nav-btn {
    padding:6px 14px; border-radius:6px; border:none; cursor:pointer;
    font-family:'DM Sans',sans-serif; font-size:0.875rem;
    transition:all 0.2s; text-decoration:none;
    display:inline-flex; align-items:center; gap:6px;
  }
  .nav-btn.ghost { background:transparent; color:var(--text2); border:1px solid var(--border); }
  .nav-btn.ghost:hover { color:var(--text); border-color:var(--border2); }
  .nav-btn.primary { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#0a0f1a; font-weight:600; }

  .main { position:relative; z-index:1; padding:40px; max-width:1200px; margin:0 auto; }

  /* TABS */
  .tabs { display:flex; gap:4px; margin-bottom:28px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:4px; width:fit-content; }
  .tab {
    padding:8px 20px; border-radius:7px; cursor:pointer; border:none;
    font-family:'DM Sans',sans-serif; font-size:0.875rem; font-weight:500;
    color:var(--text2); background:transparent; transition:all 0.2s;
  }
  .tab.active { background:var(--surface2); color:var(--text); box-shadow:0 1px 4px rgba(0,0,0,0.3); }

  /* STATS */
  .stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:28px; }
  .stat-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px 20px; }
  .stat-val { font-family:'Syne',sans-serif; font-weight:800; font-size:1.8rem; line-height:1; margin-bottom:6px; }
  .stat-label { font-size:0.75rem; color:var(--text3); text-transform:uppercase; letter-spacing:0.05em; }

  /* TABLE */
  .table-wrap { background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .table-header { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
  .table-header h3 { font-family:'Syne',sans-serif; font-weight:700; font-size:0.95rem; }
  .search-input {
    background:var(--bg3); border:1px solid var(--border); border-radius:8px;
    padding:7px 14px 7px 34px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:0.85rem;
    outline:none; width:220px; transition:border-color 0.2s;
  }
  .search-input:focus { border-color:var(--accent); }
  .search-wrap { position:relative; }
  .search-wrap::before { content:'🔍'; position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:13px; opacity:0.5; pointer-events:none; }

  table { width:100%; border-collapse:collapse; }
  thead tr { border-bottom:1px solid var(--border); }
  th { text-align:left; padding:12px 18px; font-size:0.72rem; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--text3); }
  td { padding:13px 18px; font-size:0.875rem; border-bottom:1px solid var(--border); vertical-align:middle; }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:rgba(99,179,237,0.03); }

  .role-badge {
    padding:2px 10px; border-radius:100px; font-size:0.7rem; font-weight:600;
  }
  .role-badge.admin { background:rgba(167,139,250,0.15); color:var(--accent3); }
  .role-badge.user { background:rgba(99,179,237,0.1); color:var(--text2); }

  .status-badge { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:100px; font-size:0.72rem; font-weight:600; }
  .status-badge.safe { background:rgba(52,211,153,0.12); color:var(--success); }
  .status-badge.caution { background:rgba(251,191,36,0.12); color:var(--warning); }
  .status-badge.unsafe { background:rgba(248,113,113,0.12); color:var(--danger); }

  .action-btn {
    padding:4px 10px; border-radius:6px; cursor:pointer; border:none;
    font-family:'DM Sans',sans-serif; font-size:0.78rem; font-weight:500;
    transition:all 0.2s; margin-left:4px;
  }
  .action-btn.promote { background:rgba(167,139,250,0.15); color:var(--accent3); }
  .action-btn.promote:hover { background:rgba(167,139,250,0.25); }
  .action-btn.demote { background:rgba(99,179,237,0.1); color:var(--text2); }
  .action-btn.demote:hover { background:rgba(99,179,237,0.2); }
  .action-btn.delete { background:rgba(248,113,113,0.1); color:var(--danger); }
  .action-btn.delete:hover { background:rgba(248,113,113,0.2); }

  .spinner { width:40px; height:40px; margin:40px auto; border-radius:50%; border:3px solid var(--border); border-top-color:var(--accent); animation:spin 0.9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .empty-state { text-align:center; padding:48px 20px; color:var(--text3); }
  .empty-state .empty-icon { font-size:2.5rem; margin-bottom:12px; }

  .toast {
    position:fixed; bottom:24px; right:24px; z-index:999;
    background:var(--surface2); border:1px solid var(--border2);
    border-radius:10px; padding:12px 18px;
    font-size:0.875rem; color:var(--text);
    animation:slideUp 0.3s ease;
    display:none;
  }
  @keyframes slideUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }

  @media(max-width:900px) {
    header { padding:0 16px; }
    .main { padding:20px 16px; }
    .stats-row { grid-template-columns:repeat(2,1fr); }
  }
  @media(max-width:600px) {
    th:nth-child(3), td:nth-child(3),
    th:nth-child(5), td:nth-child(5) { display:none; }
  }
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:12px;">
    <a href="/app" class="logo">
      <div class="logo-icon">💧</div>
      Chemsbury <span>Solutions</span>
    </a>
    <span class="admin-badge">Admin</span>
  </div>
  <div class="header-right">
    <a href="/dashboard" class="nav-btn ghost">📊 My Dashboard</a>
    <a href="/app" class="nav-btn primary">+ New Analysis</a>
    <button class="nav-btn ghost" onclick="logout()">Sign Out</button>
  </div>
</header>

<div class="main">

  <div style="margin-bottom:28px;">
    <h1 style="font-family:'Syne',sans-serif;font-weight:800;font-size:1.8rem;letter-spacing:-0.02em;margin-bottom:6px;">Admin Panel</h1>
    <p style="color:var(--text2);font-size:0.9rem;">Manage users and view all water analysis records</p>
  </div>

  <div class="stats-row" id="statsRow">
    <div class="stat-card"><div class="stat-val" id="sTotalUsers">—</div><div class="stat-label">Total Users</div></div>
    <div class="stat-card"><div class="stat-val" id="sTotalAnalyses">—</div><div class="stat-label">Total Analyses</div></div>
    <div class="stat-card"><div class="stat-val" id="sSafeCount">—</div><div class="stat-label">Safe Results</div></div>
    <div class="stat-card"><div class="stat-val" id="sUnsafeCount">—</div><div class="stat-label">Require Attention</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabUsers" onclick="switchTab('users')">👥 Users</button>
    <button class="tab" id="tabAnalyses" onclick="switchTab('analyses')">🔬 All Analyses</button>
  </div>

  <!-- USERS TABLE -->
  <div id="usersPane">
    <div class="table-wrap">
      <div class="table-header">
        <h3>Registered Users</h3>
        <div class="search-wrap">
          <input type="text" class="search-input" id="userSearch" placeholder="Search users…" oninput="filterUsers(this.value)">
        </div>
      </div>
      <div id="usersBody"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- ANALYSES TABLE -->
  <div id="analysesPane" style="display:none;">
    <div class="table-wrap">
      <div class="table-header">
        <h3>All Analyses</h3>
        <div class="search-wrap">
          <input type="text" class="search-input" id="analysisSearch" placeholder="Search analyses…" oninput="filterAnalyses(this.value)">
        </div>
      </div>
      <div id="analysesBody"><div class="spinner"></div></div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  const token = localStorage.getItem('chem_token');
  const me = JSON.parse(localStorage.getItem('chem_user') || '{}');

  if (!token) { window.location.href = '/'; }
  if (me.role !== 'admin') { window.location.href = '/app'; }

  let allUsers = [], allAnalyses = [];

  async function loadAll() {
    try {
      const [uResp, aResp] = await Promise.all([
        fetch('/api/admin/users', { headers: { 'Authorization': 'Bearer ' + token } }),
        fetch('/api/admin/analyses', { headers: { 'Authorization': 'Bearer ' + token } })
      ]);
      if (uResp.status === 401 || uResp.status === 403) { window.location.href = '/'; return; }
      allUsers = await uResp.json();
      allAnalyses = await aResp.json();

      document.getElementById('sTotalUsers').textContent = allUsers.length;
      document.getElementById('sTotalAnalyses').textContent = allAnalyses.length;
      document.getElementById('sSafeCount').textContent = allAnalyses.filter(a => a.safety_status === 'safe').length;
      document.getElementById('sUnsafeCount').textContent = allAnalyses.filter(a => a.safety_status !== 'safe').length;

      renderUsers(allUsers);
      renderAnalyses(allAnalyses);
    } catch(e) {
      showToast('⚠️ Failed to load data');
    }
  }

  function switchTab(tab) {
    document.getElementById('usersPane').style.display = tab === 'users' ? 'block' : 'none';
    document.getElementById('analysesPane').style.display = tab === 'analyses' ? 'block' : 'none';
    document.getElementById('tabUsers').classList.toggle('active', tab === 'users');
    document.getElementById('tabAnalyses').classList.toggle('active', tab === 'analyses');
  }

  function renderUsers(data) {
    const body = document.getElementById('usersBody');
    if (!data.length) {
      body.innerHTML = '<div class="empty-state"><div class="empty-icon">👥</div><p>No users found.</p></div>';
      return;
    }
    body.innerHTML = `<table>
      <thead><tr>
        <th>Name</th><th>Email</th><th>Company</th>
        <th>Role</th><th>Analyses</th><th>Joined</th><th>Actions</th>
      </tr></thead>
      <tbody>
        ${data.map(u => `
          <tr id="urow_${u.id}">
            <td style="font-weight:500;">${escHtml(u.name)}</td>
            <td style="color:var(--text2);font-size:0.82rem;">${escHtml(u.email)}</td>
            <td style="color:var(--text3);font-size:0.82rem;">${escHtml(u.company || '—')}</td>
            <td><span class="role-badge ${u.role}">${u.role}</span></td>
            <td style="font-family:'Syne',sans-serif;font-weight:700;color:var(--accent);">${u.analysis_count}</td>
            <td style="color:var(--text3);font-size:0.78rem;">${shortDate(u.created_at)}</td>
            <td>
              ${u.id !== me.id ? `
                ${u.role === 'user'
                  ? `<button class="action-btn promote" onclick="setRole(${u.id},'admin')">↑ Admin</button>`
                  : `<button class="action-btn demote" onclick="setRole(${u.id},'user')">↓ User</button>`
                }
                <button class="action-btn delete" onclick="deleteUser(${u.id}, '${escHtml(u.name)}')">✕ Delete</button>
              ` : '<span style="font-size:0.75rem;color:var(--text3);">You</span>'}
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;
  }

  function renderAnalyses(data) {
    const body = document.getElementById('analysesBody');
    if (!data.length) {
      body.innerHTML = '<div class="empty-state"><div class="empty-icon">🔬</div><p>No analyses yet.</p></div>';
      return;
    }
    body.innerHTML = `<table>
      <thead><tr>
        <th>#</th><th>User</th><th>Sample / Lab</th>
        <th>Status</th><th>Method</th><th>Date</th>
      </tr></thead>
      <tbody>
        ${data.map(a => `
          <tr>
            <td style="color:var(--text3);font-size:0.78rem;">${a.id}</td>
            <td>
              <div style="font-weight:500;">${escHtml(a.user_name)}</div>
              <div style="font-size:0.75rem;color:var(--text3);">${escHtml(a.user_email)}</div>
            </td>
            <td>
              <div style="font-weight:500;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(a.lab_info || '—')}</div>
              <div style="font-size:0.75rem;color:var(--text3);">${escHtml(a.sample_info || '')}</div>
            </td>
            <td>${statusBadge(a.safety_status)}</td>
            <td style="color:var(--text2);font-size:0.82rem;">${a.method_used || '—'}</td>
            <td style="color:var(--text3);font-size:0.78rem;white-space:nowrap;">${shortDate(a.created_at)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;
  }

  function filterUsers(q) {
    q = q.toLowerCase();
    renderUsers(allUsers.filter(u =>
      u.name.toLowerCase().includes(q) ||
      u.email.toLowerCase().includes(q) ||
      (u.company || '').toLowerCase().includes(q)
    ));
  }

  function filterAnalyses(q) {
    q = q.toLowerCase();
    renderAnalyses(allAnalyses.filter(a =>
      (a.user_name || '').toLowerCase().includes(q) ||
      (a.user_email || '').toLowerCase().includes(q) ||
      (a.lab_info || '').toLowerCase().includes(q) ||
      (a.sample_info || '').toLowerCase().includes(q)
    ));
  }

  async function setRole(uid, role) {
    try {
      const resp = await fetch(`/api/admin/users/${uid}/role`, {
        method: 'PUT',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ role })
      });
      if (resp.ok) {
        const u = allUsers.find(u => u.id === uid);
        if (u) u.role = role;
        renderUsers(allUsers);
        showToast(`✅ Role updated to ${role}`);
      }
    } catch(e) { showToast('⚠️ Failed to update role'); }
  }

  async function deleteUser(uid, name) {
    if (!confirm(`Delete user "${name}" and all their analyses? This cannot be undone.`)) return;
    try {
      const resp = await fetch(`/api/admin/users/${uid}`, {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (resp.ok) {
        allUsers = allUsers.filter(u => u.id !== uid);
        allAnalyses = allAnalyses.filter(a => a.user_id !== uid);
        renderUsers(allUsers);
        renderAnalyses(allAnalyses);
        document.getElementById('sTotalUsers').textContent = allUsers.length;
        document.getElementById('sTotalAnalyses').textContent = allAnalyses.length;
        showToast(`🗑️ User deleted`);
      }
    } catch(e) { showToast('⚠️ Failed to delete user'); }
  }

  function statusBadge(s) {
    const map = { safe: ['✅','Safe','safe'], caution: ['🔔','Caution','caution'], unsafe: ['⚠️','Unsafe','unsafe'] };
    const [icon, label, cls] = map[s] || ['—','Unknown','caution'];
    return `<span class="status-badge ${cls}">${icon} ${label}</span>`;
  }

  function shortDate(dt) {
    if (!dt) return '—';
    const d = new Date(dt + (dt.endsWith('Z') ? '' : 'Z'));
    return d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
  }

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 3000);
  }

  function logout() {
    localStorage.removeItem('chem_token');
    localStorage.removeItem('chem_user');
    window.location.href = '/';
  }

  loadAll();
</script>
</body>
</html>
